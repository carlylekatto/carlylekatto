<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 144" width="100%" height="144" fill="none">
  <defs>
    <style>
      :root {
        /* Material 3 Dynamic Tokens - Light Theme */
        --md-sys-color-surface-container: #F7F2FA;
        --md-sys-color-outline-variant: #D0C9D6;
        --md-sys-color-on-surface: #1D1B20;
        --md-sys-color-primary: #6750A4;
        --md-sys-color-on-primary: #FFFFFF;
        --md-sys-color-primary-container: #EADDFF;
        --md-sys-color-on-primary-container: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Material 3 Dynamic Tokens - Dark Theme */
          --md-sys-color-surface-container: #1E1A22;
          --md-sys-color-outline-variant: #3B3442;
          --md-sys-color-on-surface: #E6E0E9;
          --md-sys-color-primary: #D0BCFF;
          --md-sys-color-on-primary: #381E72;
          --md-sys-color-primary-container: #4F378B;
          --md-sys-color-on-primary-container: #EADDFF;
        }
      }

      /* Base Surface Card - matches header.svg surface container */
      .m3-surface {
        fill: transparent;
        stroke: none;
      }

      /* M3 Square Badge - Primary Fill (swapped with icon color) */
      .m3-badge {
        fill: var(--md-sys-color-primary);
        stroke: none;
        transition: fill 0.2s ease;
      }

      /* Icon - On-Primary Fill (swapped with badge background) */
      .m3-icon {
        fill: var(--md-sys-color-on-primary);
        transition: fill 0.2s ease;
      }

      /* Tech Label Under Each Badge */
      .tech-label {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2px;
        fill: var(--md-sys-color-on-surface);
        text-anchor: middle;
        transition: fill 0.2s ease;
      }

      .badge-group:hover .m3-badge {
        fill: var(--md-sys-color-primary-container);
      }

      .badge-group:hover .m3-icon {
        fill: var(--md-sys-color-on-primary-container);
      }

      .badge-group:hover .tech-label {
        fill: var(--md-sys-color-primary);
      }
    </style>
  </defs>

