<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #6750A4;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
        --icon-hover-color: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #D0BCFF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
          --icon-hover-color: #FFFFFF;
        }
      }

      .m3-squircle {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .m3-icon {
        fill: var(--icon-color);
        transition: fill 0.2s ease;
      }

      .social-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: 16px 16px;
      }

      .social-group:hover {
        transform: scale(1.08);
      }

      .social-group:hover .m3-squircle {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }

      .social-group:hover .m3-icon {
        fill: var(--icon-hover-color);
      }
    </style>
  </defs>

  <g class="social-group" cursor="pointer">
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" class="m3-squircle" />
    <g transform="translate(7, 7) scale(0.0281)">
      <path class="m3-icon" d="M320 72C183 72 72 183 72 320C72 457 183 568 320 568C457 568 568 457 568 320C568 183 457 72 320 72zM435 240.7C431.3 279.9 415.1 375.1 406.9 419C403.4 437.6 396.6 443.8 390 444.4C375.6 445.7 364.7 434.9 350.7 425.7C328.9 411.4 316.5 402.5 295.4 388.5C270.9 372.4 286.8 363.5 300.7 349C304.4 345.2 367.8 287.5 369 282.3C369.2 281.6 369.3 279.2 367.8 277.9C366.3 276.6 364.2 277.1 362.7 277.4C360.5 277.9 325.6 300.9 258.1 346.5C248.2 353.3 239.2 356.6 231.2 356.4C222.3 356.2 205.3 351.4 192.6 347.3C177.1 342.3 164.7 339.6 165.8 331C166.4 326.5 172.5 322 184.2 317.3C256.5 285.8 304.7 265 328.8 255C397.7 226.4 412 221.4 421.3 221.2C423.4 221.2 427.9 221.7 430.9 224.1C432.9 225.8 434.1 228.2 434.4 230.8C434.9 234 435 237.3 434.8 240.6z"/>
    </g>
  </g>
</svg>
