<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #6750A4;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
        --icon-hover-color: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #D0BCFF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
          --icon-hover-color: #FFFFFF;
        }
      }

      .m3-squircle {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .m3-icon {
        fill: var(--icon-color);
        transition: fill 0.2s ease;
      }

      .social-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: 16px 16px;
      }

      .social-group:hover {
        transform: scale(1.08);
      }

      .social-group:hover .m3-squircle {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }

      .social-group:hover .m3-icon {
        fill: var(--icon-hover-color);
      }
    </style>
  </defs>

  <g class="social-group" cursor="pointer">
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" class="m3-squircle" />
    <g transform="translate(8.5, 7.5) scale(0.625)">
      <path class="m3-icon" d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.5.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/>
    </g>
  </g>
</svg>
