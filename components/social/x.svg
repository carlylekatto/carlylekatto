<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #6750A4;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
        --icon-hover-color: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #D0BCFF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
          --icon-hover-color: #FFFFFF;
        }
      }

      .m3-squircle {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .m3-icon {
        fill: var(--icon-color);
        transition: fill 0.2s ease;
      }

      .social-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: 16px 16px;
      }

      .social-group:hover {
        transform: scale(1.08);
      }

      .social-group:hover .m3-squircle {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }

      .social-group:hover .m3-icon {
        fill: var(--icon-hover-color);
      }
    </style>
  </defs>

  <g class="social-group" cursor="pointer">
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" class="m3-squircle" />
    <g transform="translate(8, 8) scale(0.025)">
      <path class="m3-icon" d="M453.2 112L523.8 112L369.6 288.2L551 528L409 528L297.7 382.6L170.5 528L99.8 528L264.7 339.5L90.8 112L236.4 112L336.9 244.9L453.2 112zM428.4 485.8L467.5 485.8L215.1 152L173.1 152L428.4 485.8z"/>
    </g>
  </g>
</svg>
