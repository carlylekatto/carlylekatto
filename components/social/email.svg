<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #6750A4;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
        --icon-hover-color: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #D0BCFF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
          --icon-hover-color: #FFFFFF;
        }
      }

      .m3-squircle {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .m3-icon {
        fill: var(--icon-color);
        transition: fill 0.2s ease;
      }

      .social-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: 16px 16px;
      }

      .social-group:hover {
        transform: scale(1.08);
      }

      .social-group:hover .m3-squircle {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }

      .social-group:hover .m3-icon {
        fill: var(--icon-hover-color);
      }
    </style>
  </defs>

  <g class="social-group" cursor="pointer">
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" class="m3-squircle" />
    <g transform="translate(7.5, 8) scale(0.0265)">
      <path class="m3-icon" d="M112 128C76.7 128 48 156.7 48 192L48 448C48 483.3 76.7 512 112 512L528 512C563.3 512 592 483.3 592 448L592 192C592 156.7 563.3 128 528 128L112 128zM544 227.3L336.8 393.1C326.9 401 313.1 401 303.2 393.1L96 227.3L96 192C96 183.2 103.2 176 112 176L528 176C536.8 176 544 183.2 544 192L544 227.3z"/>
    </g>
  </g>
</svg>
