<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #1877F2;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #4599FF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
        }
      }

      .m3-circle-badge {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .badge-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: center;
      }

      .badge-group:hover {
        transform: scale(1.06);
      }

      .badge-group:hover .m3-circle-badge {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }
    </style>
  </defs>

  <g class="badge-group" cursor="pointer">
    <!-- M3 Circular Badge (w=40, h=40, r=19.5) -->
    <circle cx="20" cy="20" r="19.5" class="m3-circle-badge" />

    <!-- Centered Brand Icon (20x20 in 40x40 circle) -->
    <g transform="translate(10, 10) scale(0.03125)">
      <path fill="var(--icon-color)" d="M576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 440 146.7 540.8 258.2 568.5L258.2 398.2L205.4 398.2L205.4 320L258.2 320L258.2 286.3C258.2 199.2 297.6 158.8 383.2 158.8C399.4 158.8 427.4 162 438.9 165.2L438.9 236C432.9 235.4 422.4 235 409.3 235C367.3 235 351.1 250.9 351.1 292.2L351.1 320L434.7 320L420.3 398.2L351 398.2L351 574.1C477.8 558.8 576 450.9 576 320z"/>
    </g>
  </g>
</svg>
