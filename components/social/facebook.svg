<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <style>
      :root {
        --badge-bg: #ECE6F0;
        --badge-stroke: #D0C9D6;
        --icon-color: #6750A4;
        --badge-hover-bg: #EADDFF;
        --badge-hover-stroke: #6750A4;
        --icon-hover-color: #21005D;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --badge-bg: #2A2430;
          --badge-stroke: #3B3442;
          --icon-color: #D0BCFF;
          --badge-hover-bg: #4F378B;
          --badge-hover-stroke: #D0BCFF;
          --icon-hover-color: #FFFFFF;
        }
      }

      .m3-squircle {
        fill: var(--badge-bg);
        stroke: var(--badge-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .m3-icon {
        fill: var(--icon-color);
        transition: fill 0.2s ease;
      }

      .social-group {
        transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        transform-origin: 16px 16px;
      }

      .social-group:hover {
        transform: scale(1.08);
      }

      .social-group:hover .m3-squircle {
        fill: var(--badge-hover-bg);
        stroke: var(--badge-hover-stroke);
      }

      .social-group:hover .m3-icon {
        fill: var(--icon-hover-color);
      }
    </style>
  </defs>

  <g class="social-group" cursor="pointer">
    <rect x="0.5" y="0.5" width="31" height="31" rx="9" class="m3-squircle" />
    <g transform="translate(8, 7) scale(0.0265)">
      <path class="m3-icon" d="M576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 440 146.7 540.8 258.2 568.5L258.2 398.2L205.4 398.2L205.4 320L258.2 320L258.2 286.3C258.2 199.2 297.6 158.8 383.2 158.8C399.4 158.8 427.4 162 438.9 165.2L438.9 236C432.9 235.4 422.4 235 409.3 235C367.3 235 351.1 250.9 351.1 292.2L351.1 320L434.7 320L420.3 398.2L351 398.2L351 574.1C477.8 558.8 576 450.9 576 320z"/>
    </g>
  </g>
</svg>
