<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 40" width="235" height="40" fill="none">
  <defs>
    <style>
      @font-face {
        font-family: 'Space Mono';
        font-style: normal;
        font-weight: 700;
        src: url('data:font/woff2;base64,') format('woff2');
      }

      :root {
        --chip-bg: #ECE6F0;
        --chip-stroke: #D0C9D6;
        --chip-text: #1D1B20;
        --icon-color: #6D4AFF;
        --chip-hover-bg: #EADDFF;
        --chip-hover-stroke: #6750A4;
        --chip-hover-text: #6750A4;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --chip-bg: #2A2430;
          --chip-stroke: #3B3442;
          --chip-text: #E6E0E9;
          --icon-color: #8B6DFF;
          --chip-hover-bg: #4F378B;
          --chip-hover-stroke: #D0BCFF;
          --chip-hover-text: #D0BCFF;
        }
      }

      .m3-chip {
        fill: var(--chip-bg);
        stroke: var(--chip-stroke);
        stroke-width: 1px;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .chip-text {
        font-family: 'Space Mono', 'Fira Code', 'Space Grotesk', monospace;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.1px;
        fill: var(--chip-text);
        transition: fill 0.2s ease;
      }

      .chip-group:hover .m3-chip {
        fill: var(--chip-hover-bg);
        stroke: var(--chip-hover-stroke);
      }

      .chip-group:hover .chip-text {
        fill: var(--chip-hover-text);
      }
    </style>
  </defs>

  <g class="chip-group" cursor="pointer">
    <!-- M3 Full Rounded Pill Chip (w=235, h=40, rx=20) -->
    <rect x="0.5" y="0.5" width="234" height="39" rx="19.5" class="m3-chip" />

    <!-- Mail Envelope Icon (Centered: 16px left padding, 20x20 size) -->
    <g transform="translate(16, 10) scale(0.03125)">
      <path fill="var(--icon-color)" d="M112 128C76.7 128 48 156.7 48 192L48 448C48 483.3 76.7 512 112 512L528 512C563.3 512 592 483.3 592 448L592 192C592 156.7 563.3 128 528 128L112 128zM544 227.3L336.8 393.1C326.9 401 313.1 401 303.2 393.1L96 227.3L96 192C96 183.2 103.2 176 112 176L528 176C536.8 176 544 183.2 544 192L544 227.3z"/>
    </g>

    <!-- Email Address in Space Mono Bold (16px right padding, perfectly symmetrical) -->
    <text x="44" y="25" class="chip-text">carlylekatto@proton.me</text>
  </g>
</svg>
