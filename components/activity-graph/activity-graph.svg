<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="100%" height="280" fill="none">
  <defs>
    <style>
      :root {
        /* Light Theme */
        --md-sys-color-surface-container: #F7F2FA;
        --md-sys-color-outline-variant: #D0C9D6;
        --md-sys-color-on-surface: #1D1B20;
        --md-sys-color-outline: #79747E;
        --graph-line: #0077B6;
        --graph-point: #0096C7;
        --graph-point-stroke: #FFFFFF;
        --grid-line-color: rgba(121, 116, 126, 0.22);
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Dark Theme */
          --md-sys-color-surface-container: #1E1A22;
          --md-sys-color-outline-variant: #3B3442;
          --md-sys-color-on-surface: #E6E0E9;
          --md-sys-color-outline: #938F99;
          --graph-line: #38BDF8;
          --graph-point: #38BDF8;
          --graph-point-stroke: #1E1A22;
          --grid-line-color: rgba(147, 143, 153, 0.20);
        }
      }

      /* Base Surface Card */
      .m3-surface {
        fill: transparent;
        stroke: none;
      }

      /* Title */
      .chart-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.15px;
        fill: var(--md-sys-color-on-surface);
        text-anchor: middle;
      }

      .axis-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.2px;
        fill: var(--md-sys-color-on-surface);
        text-anchor: middle;
      }

      .axis-tick-y {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: var(--md-sys-color-on-surface);
        text-anchor: end;
      }

      .axis-tick-x {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 11px;
        font-weight: 700;
        fill: var(--md-sys-color-on-surface);
        text-anchor: middle;
      }

      /* Grid Lines */
      .grid-line {
        stroke: var(--grid-line-color);
        stroke-width: 1px;
      }

      /* Curve and Points */
      .activity-curve {
        stroke: var(--graph-line);
        stroke-width: 3.2px;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .data-dot {
        fill: var(--graph-point);
        stroke: var(--graph-point-stroke);
        stroke-width: 1.5px;
        cursor: pointer;
        transition: r 0.2s ease;
      }

      .data-dot:hover {
        r: 5.5px;
      }

      .data-dot-peak {
        fill: var(--graph-point);
        stroke: var(--graph-point-stroke);
        stroke-width: 2px;
        cursor: pointer;
        filter: drop-shadow(0 0 4px var(--graph-line));
      }
    </style>
  </defs>

