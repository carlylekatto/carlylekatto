name: Generate Snake Animation

on:
  # Run automatically every day at 00:30 UTC (off-peak to avoid queue bottlenecks)
  schedule:
    - cron: "30 0 * * *"

  # Allows manual triggering at any time
  workflow_dispatch:

  # Run on push to main only when the workflow file itself changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Snake
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_dots=#E7E0EC,#E8DEF8,#D0BCFF,#9A82DB,#6750A4&color_snake=#0077B6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=#25212B,#3B3442,#4F378B,#7F67BE,#D0BCFF&color_snake=#38BDF8

      - name: Deploy snake SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

